<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --surface-2: #f4f4f1; --page: #f9f9f7; --side: #f1f1ed;
  --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10); --border-strong: rgba(11,11,11,0.18);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --gain: #0b8a0b; --loss: #c83232;
  --shadow: 0 1px 2px rgba(11,11,11,.06), 0 4px 12px rgba(11,11,11,.04);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --surface-2: #232322; --page: #0d0d0d; --side: #141413;
  --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --gain: #2fbf4a; --loss: #f0625f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink-1);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.n, .mono, td.n { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: var(--ink-1); background: var(--surface-1);
  border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 11px; }
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: .5; cursor: default; }
button.primary, button.primary:hover:not(:disabled) { background: var(--ink-1); color: var(--page); border-color: var(--ink-1); font-weight: 600; }
button.on, button.on:hover:not(:disabled) { background: var(--ink-1); color: var(--page); border-color: var(--ink-1); }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover:not(:disabled) { background: var(--surface-2); }
button.sm { padding: 3px 8px; font-size: 12.5px; }
button.danger { color: var(--critical); }
a { color: var(--s1); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }

/* ---------------------------------------------------------------- shell */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column;
  min-height: 0; }
.brand { padding: 14px 14px 8px; }
.logo { width: 100%; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: var(--surface-1); border: 1px solid var(--border); }
.logo img { width: 100%; height: 100%; display: block; }
.logo.empty { border-style: dashed; color: var(--ink-3); font-size: 12px; text-align: center; padding: 8px; cursor: pointer; }
.logo.empty b { display: block; color: var(--ink-1); font-size: 17px; letter-spacing: -.01em; }
.clock { padding: 6px 16px 12px; border-bottom: 1px solid var(--border); }
.clock .t { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.clock .t small { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
.clock .d { color: var(--ink-2); font-size: 13px; }
.mkt { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; display: inline-block; }
.dot.run { background: var(--good); } .dot.warn { background: var(--warning); } .dot.err { background: var(--critical); }
.dot.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
nav a.item, nav .grp { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
  color: var(--ink-1); text-decoration: none; font-weight: 500; cursor: pointer; user-select: none; }
nav a.item:hover { background: var(--surface-2); }
nav a.item.active { background: var(--surface-1); box-shadow: var(--shadow); }
nav .grp { color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  margin-top: 6px; padding-bottom: 3px; }
nav .grp .chev { margin-left: auto; transition: transform .15s; }
nav .grp.closed .chev { transform: rotate(-90deg); }
nav .kids { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border); }
nav .kids.closed { display: none; }
nav .ico { width: 18px; height: 18px; flex: none; color: var(--ink-2); }
nav a.item .dot { margin-left: auto; }
nav .ext { margin-left: auto; color: var(--ink-3); font-size: 11px; }
.sidefoot { border-top: 1px solid var(--border); padding: 8px; }
.stamp { color: var(--ink-3); font-size: 11px; padding: 4px 10px 2px; }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; padding: 11px 20px; border-bottom: 1px solid var(--border);
  background: var(--page); flex-wrap: wrap; min-height: 56px; }
.top h1 { font-size: 17px; }
.top .sub { color: var(--ink-2); font-size: 12.5px; }
.spacer { flex: 1; }
#menuBtn { display: none; }
.view { flex: 1; min-height: 0; overflow: auto; position: relative; }
.pad { padding: 18px 20px 60px; }
.frames { position: absolute; inset: 0; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--page); display: none; }
.frames iframe.show { display: block; }

.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
.panel > h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px; }
.banner { border: 1px solid var(--border-strong); border-radius: 9px; padding: 10px 14px; margin: 0 0 14px; font-size: 13px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, var(--surface-1)); }
.banner.err { border-color: var(--critical); background: color-mix(in srgb, var(--critical) 9%, var(--surface-1)); }
.banner.info { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 8%, var(--surface-1)); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.center-msg { max-width: 560px; margin: 12vh auto 0; text-align: center; padding: 0 20px; }
.center-msg h2 { font-size: 20px; margin-bottom: 6px; }
.center-msg p { color: var(--ink-2); }
pre.log { text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  font-size: 11.5px; max-height: 280px; overflow: auto; white-space: pre-wrap; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--grid); border-top-color: var(--s1); border-radius: 50%;
  animation: spin .8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink-1); color: var(--page); padding: 9px 14px;
  border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px);
  transition: all .2s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 1px 9px; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.chip.hi { border-color: var(--serious); color: var(--serious); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 11px; }
.seg button + button { border-left: 1px solid var(--border-strong); }

/* ---------------------------------------------------------------- tables */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 600;
  position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.past td { color: var(--ink-3); }
tr.next td { background: color-mix(in srgb, var(--s1) 8%, transparent); }
.gain { color: var(--gain); } .loss { color: var(--loss); }
.tick { font-weight: 700; letter-spacing: .02em; }
.nm { display: inline-block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
@media (max-width: 1500px) { .nm { max-width: 90px; } }
.lg { width: 20px; height: 20px; border-radius: 5px; object-fit: contain; background: #fff; vertical-align: middle; }
.tblwrap { overflow: auto; max-height: calc(100vh - 230px); }

/* ---------------------------------------------------------------- events */
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .cols2 { grid-template-columns: 1fr; } }
.sess { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); font-weight: 600;
  padding: 10px 8px 4px; display: flex; gap: 8px; align-items: center; }

.evleft { min-width: 0; }
.jtext { width: 100%; min-height: 170px; resize: vertical; line-height: 1.55; padding: 10px 12px; font-size: 14px;
  background: var(--surface-1); border-radius: 9px; }
.jtext:focus { outline: 2px solid color-mix(in srgb, var(--s1) 55%, transparent); outline-offset: 0; }
.jstat { font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink-3); }
.jstat.ok { color: var(--good); } .jstat.bad { color: var(--critical); }
.jpast { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.jpast summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
#jList { max-height: 340px; overflow-y: auto; }
.jentry { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--grid); border-radius: 0; background: transparent; padding: 8px 4px; }
.jentry:hover:not(:disabled) { background: var(--surface-2); }
.jentry.cur { background: color-mix(in srgb, var(--s1) 9%, transparent); }
.jentry .jd { font-weight: 600; font-size: 13px; }
.jentry .jp { font-size: 12.5px; color: var(--ink-2); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.jentry mark { background: color-mix(in srgb, var(--warning) 45%, transparent); color: inherit; border-radius: 2px; }

/* ---------------------------------------------------------------- P&L */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow); }
.kpi .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-2); }
.drop { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 16px; text-align: center; color: var(--ink-2);
  transition: background .15s; }
.drop.over { background: color-mix(in srgb, var(--s1) 10%, transparent); border-color: var(--s1); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(92px, .9fr); gap: 4px; }
.cal .h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; text-align: center; padding: 2px 0; }
.day { min-height: 76px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); padding: 5px 7px;
  display: flex; flex-direction: column; gap: 1px; position: relative; font-variant-numeric: tabular-nums; }
.day.out { opacity: .35; }
.day.wkend { background: var(--surface-2); }
.day .dn { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.day.today .dn { color: var(--s1); }
.day .pv { font-weight: 650; font-size: 13.5px; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.day .tc { font-size: 11px; color: var(--ink-2); }
.day.has { cursor: pointer; }
.day.has:hover { outline: 2px solid var(--ink-1); outline-offset: -1px; }
.day.sel { outline: 2px solid var(--s1); outline-offset: -1px; }
.day .um { position: absolute; top: 5px; right: 6px; color: var(--warning); font-size: 12px; font-weight: 700; }
.wk { border-radius: 8px; border: 1px solid var(--border-strong); padding: 5px 8px; display: flex; flex-direction: column;
  justify-content: center; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.wk .l { font-size: 11px; color: var(--ink-3); }
.wk .v { font-weight: 650; }
.pnlgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1150px) { .pnlgrid { grid-template-columns: 1fr; } }
.trade { border-bottom: 1px solid var(--grid); padding: 8px 2px; }
.trade .r1 { display: flex; gap: 8px; align-items: baseline; }
.trade .r1 .pv { margin-left: auto; font-weight: 650; font-variant-numeric: tabular-nums; }
.trade .r2 { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
#eq { width: 100%; height: 220px; display: block; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border-strong); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); z-index: 90; display: none; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- portfolio visual */
.pf { max-width: 1200px; margin: 0 auto; }
.pf-title { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.pf-sub { color: var(--ink-2); margin: 0 0 16px; }
.pf-body { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-start; }
.pf-chart { width: 360px; max-width: 100%; flex: 0 0 auto; margin: 0 auto; }
.pf-donut { width: 100%; height: auto; display: block; overflow: visible; }
.pf-slice { cursor: pointer; stroke: var(--page); stroke-width: 2.5; transition: opacity .15s, filter .15s; }
.pf-slice:hover { filter: brightness(1.08); }
.pf-slice.dim { opacity: .3; }
.pf-ring { fill: var(--page); stroke: var(--border-strong); stroke-width: 1; }
.pf-lab { font-weight: 700; font-size: 15px; pointer-events: none; }
.pf-tablewrap { flex: 1 1 480px; min-width: 0; overflow-x: auto; }
.pf-table th { background: transparent; position: static; }
.pf-table td { padding: 9px 8px; }
.pf-row { cursor: pointer; }
.pf-row:hover td { background: var(--surface-2); }
.pf-row.act td { background: color-mix(in srgb, var(--s1) 12%, transparent); }
.pf-tk { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
.pf-sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.pf-b { font-weight: 700; }
.pf-notes { color: var(--ink-2); }
.pf-foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--ink-2); text-align: center; line-height: 1.9; }
.pf-sep { color: var(--ink-3); margin: 0 6px; }
.pf-h2 { font-size: 18px; font-weight: 700; margin: 30px 0 8px; }
.pf-card { margin-top: 14px; border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px 14px; background: var(--surface-1); box-shadow: var(--shadow); }
.pf-cardh { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.pf-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 2px 18px; }
.pf-kv div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--grid); font-size: 13.5px; }
.pf-kv span { color: var(--ink-2); }
.pf-kv b { font-variant-numeric: tabular-nums; text-align: right; }

/* ---------------------------------------------------------------- morning / lookup / track record / market */
.nbadge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--serious); color: #fff;
  font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .mgrid { grid-template-columns: 1fr; } }
.mstrip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.mgrid .mstrip { grid-template-columns: 1fr; }
@media (max-width: 1250px) { .mstrip { grid-template-columns: 1fr; } }
.hm { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 5px; }
.hm-tile { border-radius: 8px; padding: 6px 8px; border: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
.hm-t { font-weight: 700; font-size: 13px; }
.hm-n { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-c { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 14px; }
.hm-lean { font-size: 10.5px; color: var(--ink-2); }
.tide { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; color: var(--ink-2); margin-top: 2px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.wrow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.wtk { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.wtk a { color: var(--ink-1); text-decoration: none; }
.wi { margin-bottom: 4px; }
.wico { font-size: 11px; display: inline-block; width: 14px; text-align: center; }
.wico.serious { color: var(--serious); } .wico.warn { color: var(--warning); } .wico.ok { color: var(--good); }
.jprev { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; max-height: 260px; overflow: auto; color: var(--ink-1); }
.prow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
.pdesk { font-weight: 600; color: var(--ink-1); text-decoration: none; }
.pick { display: inline-block; margin: 0 10px 2px 0; color: var(--ink-1); text-decoration: none; }
.pick:hover b { text-decoration: underline; }
.sysrow { display: flex; flex-wrap: wrap; gap: 6px; }
.lkform { display: flex; gap: 6px; }
.lkform input { width: 130px; text-transform: uppercase; font-weight: 600; letter-spacing: .03em; padding: 4px 9px; }
.lkhead { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.lkt { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.lkp { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.lkgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .lkgrid { grid-template-columns: minmax(0, 1fr); } }
.lkgrid > div { min-width: 0; }
.drow { grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); margin-bottom: 4px; }   /* desk cards: one row when wide */
.lkgrid { margin-bottom: 16px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 0 16px; }
.dcard .big { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.dcard p { margin: 4px 0; }
.sizer { position: sticky; top: 12px; }
.szf { display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 8px; margin: 8px 0; }
.szf label { color: var(--ink-2); font-size: 13px; }
.szin { display: flex; align-items: center; gap: 6px; }
.szin input { width: 96px; font-variant-numeric: tabular-nums; }
.szin span { color: var(--ink-3); font-size: 12.5px; }
.sz-side { margin: 2px 0 6px; }
.szres { border-top: 1px solid var(--border); padding-top: 10px; }
.szsh { display: flex; align-items: baseline; gap: 10px; }
.szsh .n { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
.szkv { display: grid; grid-template-columns: 1fr; gap: 0; margin: 6px 0; }
.szkv div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--grid); font-size: 13.5px; }
.szkv span { color: var(--ink-2); }
.szkv b { font-variant-numeric: tabular-nums; text-align: right; }
.szwarn { color: var(--serious); }

/* ---------------------------------------------------------------- settings */
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; align-items: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.row label { min-width: 130px; color: var(--ink-2); font-size: 13px; }
.row input[type=text], .row input[type=url], .row select { flex: 1; min-width: 160px; }
.menu-ed { list-style: none; margin: 0; padding: 0; }
.menu-ed li { display: flex; align-items: center; gap: 6px; padding: 6px 6px; border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 6px; background: var(--surface-1); }
.menu-ed li.drag { opacity: .4; }
.menu-ed li.over { border-color: var(--s1); }
.menu-ed .grip { cursor: grab; color: var(--ink-3); padding: 0 4px; user-select: none; }
.menu-ed input { flex: 1; min-width: 80px; padding: 4px 8px; }
.menu-ed .kidsed { margin: 0 0 6px 28px; }
.menu-ed .tag { font-size: 11px; color: var(--ink-3); min-width: 56px; }
.deskcfg { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.deskcfg .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.saved { color: var(--good); font-size: 12.5px; opacity: 0; transition: opacity .3s; }
.saved.show { opacity: 1; }
input[type=range] { padding: 0; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50; transform: translateX(-100%); transition: transform .2s;
    box-shadow: var(--shadow); }
  aside.open { transform: none; }
  #menuBtn { display: inline-block; }
  .pad { padding: 14px 16px 60px; }
  .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal .wk, .cal .h.wkh { display: none; }
  .day { min-height: 58px; padding: 3px 4px; }
  .day .pv { font-size: 9.5px; letter-spacing: -.03em; }
  .day .tc { display: none; }
  .set-grid { grid-template-columns: 1fr; }
}

/* ---------------------------------------------------------------- how it works */
.gd-jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.gd-jump a { font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--border-strong); border-radius: 999px; color: var(--ink-2); text-decoration: none; }
.gd-jump a:hover { background: var(--surface-2); color: var(--ink-1); }
.gd-sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 18px 0 10px; }
.gd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 16px; align-items: start; }
.gd-card { margin: 0; scroll-margin-top: 12px; }
.gd-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gd-head h3 { margin: 0; font-size: 16px; }
.gd-live { border-color: var(--good); color: var(--good); }
.gd-q { margin: 4px 0 8px; font-style: italic; color: var(--ink-2); }
.gd-note { margin: 0 0 6px; }
.gd-how { margin: 0 0 6px; padding-left: 18px; font-size: 13.5px; line-height: 1.5; }
.gd-how li { margin: 3px 0; }
.gd-card h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin: 14px 0 6px; }
.gd-formula { margin: 0 0 6px; color: var(--ink-2); }
.gd-bands { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.gd-bars { display: grid; gap: 4px; }
.gd-bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 34%) 38px; gap: 8px; align-items: center; font-size: 13px; }
.gd-bar.sub { font-size: 12px; color: var(--ink-2); }
.gd-bar.sub .gd-lbl { padding-left: 14px; }
.gd-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.gd-track span { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.gd-bar.sub .gd-track span { background: var(--s3); opacity: .75; }
.gd-w { text-align: right; font-variant-numeric: tabular-nums; }
.gd-total { border-top: 1px solid var(--grid); padding-top: 4px; font-weight: 600; }
.gd-rules { width: 100%; font-size: 13px; border-collapse: collapse; }
.gd-rules th { text-align: left; vertical-align: top; white-space: nowrap; padding: 4px 12px 4px 0; color: var(--ink-2); font-weight: 600; width: 1%; }
.gd-rules td { padding: 4px 0; }
.gd-rules tr + tr th, .gd-rules tr + tr td { border-top: 1px solid var(--grid); }
@media (max-width: 560px) { .gd-rules th { white-space: normal; width: 34%; } }

/* ---------------------------------------------------------------- track record table */
.tr-filters { gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tr-filters select { width: auto; min-width: 140px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 11px; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button.on { background: var(--ink-1); color: var(--page); }
.modesw { display: flex; margin: 4px 12px 10px; }
/* Today (r17): folding sections and the date strip */
.fold > h2 { align-items: center; }
.foldbtn { border: 0; background: transparent; padding: 0 6px 0 0; font-size: 12px; color: var(--ink-3); line-height: 1; }
.foldbtn:hover:not(:disabled) { background: transparent; color: var(--ink-1); }
.foldt { cursor: pointer; }
.fold.closed > .fbody { display: none; }
.fold.closed > h2 { margin-bottom: 0; }
.datestrip { display: inline-flex; align-items: center; gap: 4px; }
.datestrip input[type=date] { padding: 3px 8px; }
.tdday { margin-top: 16px; grid-template-columns: minmax(0, .9fr) minmax(0, 1.35fr); }
@media (max-width: 1100px) { .tdday { grid-template-columns: minmax(0, 1fr); } }
.tdday > div { min-width: 0; }
.tdday .row { flex-wrap: wrap; }
@media (max-width: 1700px) { .tdday .nm { display: none; } }   /* the name is on the ticker's hover */
.chip.mine { border-color: var(--s1); color: var(--s1); }
.chip.good { border-color: var(--gain); color: var(--gain); } .chip.bad { border-color: var(--loss); color: var(--loss); }
#ofTbl tr[data-osi]:hover td { background: var(--surface-2); }
@media (max-width: 640px) { .datestrip input[type=date] { width: 128px; } }
.mdir { text-decoration: none; display: flex; }
.gdots { display: inline-flex; gap: 3px; vertical-align: middle; }
.gdot { width: 18px; height: 18px; border-radius: 4px; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center;
  justify-content: center; border: 1.5px solid var(--border-strong); color: var(--ink-3); }
.gdot.p { background: var(--gain); border-color: var(--gain); color: #fff; }
.gdot.f { border-color: var(--loss); color: var(--loss); }
.gdot.u { border-style: dashed; }
.gchip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; background: var(--s1); color: #fff; font-weight: 600; }
.mdirbox { border-left: 4px solid var(--ink-3); }
.mdirbox.uptrend { border-left-color: var(--gain); } .mdirbox.pressure { border-left-color: var(--warning); } .mdirbox.correction { border-left-color: var(--loss); }
.modesw button { flex: 1; font-size: 12.5px; padding: 5px 4px; }
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
th.sortable:hover { color: var(--ink-1); }
th.sortable .arr { margin-left: 4px; font-size: 10px; color: var(--ink-3); }
th.sorted { color: var(--ink-1); }
th.sorted .arr { color: var(--s1); }

/* ---------------------------------------------------------------- theme gallery (Settings -> Appearance) */
.th-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.th-card { display: flex; flex-direction: column; gap: 6px; padding: 6px; text-align: left; background: var(--surface-1);
  border: 2px solid transparent; border-radius: 12px; }
.th-card:hover:not(:disabled) { background: var(--surface-2); }
.th-card.sel { border-color: var(--s1); }
.th-prev { position: relative; overflow: hidden; height: 112px; display: flex; flex-direction: column; border: 1px solid var(--border); }
.th-top { font-size: 11px; font-weight: 700; padding: 4px 8px; white-space: nowrap; overflow: hidden; }
.th-body { flex: 1; display: flex; min-height: 0; }
.th-side { width: 30px; padding: 6px 5px; display: flex; flex-direction: column; gap: 5px; }
.th-side i { display: block; height: 4px; border-radius: 2px; opacity: .8; }
.th-panel { flex: 1; margin: 7px; padding: 5px 7px; min-width: 0; line-height: 1.25; }
.th-bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; margin-top: 3px; }
.th-bars i { display: block; flex: 1; }
.th-scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.22) 2px 3px); }
.th-name { display: flex; flex-direction: column; padding: 0 4px 2px; line-height: 1.3; }

/* ---------------------------------------------------------------- What's new */
.newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--s1); margin-left: auto; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--s1) 25%, transparent); }
.cl-filter { margin: 0 0 14px; }
.cl-filter .seg { flex-wrap: wrap; }
.cl-rel { max-width: 980px; }
.cl-new { border-color: var(--s1); }
.cl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cl-head h3 { margin: 0; font-size: 16px; }
.cl-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.cl-items { list-style: none; margin: 8px 0 0; padding: 0; }
.cl-items li { border-top: 1px solid var(--grid); padding: 7px 0; }
.cl-items summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
.cl-items summary::marker { color: var(--ink-3); }
.cl-items details p { margin: 6px 0 2px 16px; color: var(--ink-2); font-size: 13px; line-height: 1.55; }
.cl-plain { font-weight: 600; font-size: 13.5px; padding-left: 16px; }
.cl-items code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* ---------------------------------------------------------------- Watchlist + name drawer */
.wl-tbl td { vertical-align: top; }
.wl-row { cursor: pointer; }
.wl-row:hover td { background: var(--surface-2); }
.zchip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
.zchip.zin { color: var(--gain); border-color: var(--gain); background: color-mix(in srgb, var(--gain) 10%, transparent); }
.zchip.znear { color: var(--warning); border-color: var(--warning); }
.zchip.zabove { color: var(--ink-3); }
.lchip { display: inline-block; font-size: 11px; padding: 1px 7px; margin: 0 3px 3px 0; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
.lchip.good { color: var(--gain); border-color: color-mix(in srgb, var(--gain) 60%, transparent); }
.lchip.bad { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 60%, transparent); }
.tbreak { color: var(--critical); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.tok { color: var(--gain); font-size: 12.5px; white-space: nowrap; }
.wl-ev, .mn-row { padding: 4px 0; border-top: 1px solid var(--grid); }
.wl-ev:first-of-type, .mn-row:first-child { border-top: 0; }
.wl-ev.error .small, .wl-ev.stale .small { color: var(--ink-2); }
.nm-over { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 90; }
.nm-over.open { display: block; }
.nm-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--page); border-left: 1px solid var(--border-strong);
  box-shadow: -8px 0 30px rgba(0,0,0,.2); overflow-y: auto; padding: 16px 18px 40px; }
.nm-head { display: flex; align-items: flex-start; gap: 8px; }
.nm-t { font-size: 22px; font-weight: 700; }
.nm-sec { border-top: 1px solid var(--border); padding: 12px 0 4px; margin-top: 10px; }
.nm-sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.nm-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; font-size: 13px; }
.nm-kv span { display: block; color: var(--ink-3); font-size: 11.5px; }
.nm-syn { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin: 8px 0 4px; }
.nm-l { display: block; font-size: 12px; color: var(--ink-2); margin: 6px 0 3px; }
.nm-panel textarea { width: 100%; resize: vertical; font: inherit; font-size: 13px; }
.nm-nums { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 8px 0; }
.nm-nums label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.nm-nums input { width: 92px; padding: 4px 7px; }
.nm-chk { padding: 5px 0; border-top: 1px solid var(--grid); font-size: 13px; }
.nm-chk:first-child { border-top: 0; }
.nm-sig { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--grid); font-size: 12.5px; }
.nm-sig span:first-child { color: var(--ink-3); white-space: nowrap; }
.nm-sig span:last-child { text-align: right; }
.nm-ev { padding: 3px 0; }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><div id="logo" class="logo"></div></div>
    <div class="clock">
      <div class="t" id="clkT">--:--</div>
      <div class="d" id="clkD">&nbsp;</div>
      <div class="mkt" id="mkt"><span class="dot"></span><span>&nbsp;</span></div>
      <a class="mkt mdir" id="mdir" href="#/desk/growth" title="Market direction (O'Neil-style), from the Growth Leaders desk" style="display:none"></a>
    </div>
    <div class="seg modesw" id="modeSw" title="Invest: valuation, funds, insiders, your watchlist and portfolio. Trade: flow, swings, growth leaders, P&amp;L.">
      <button data-m="invest">Invest</button><button data-m="trade">Trade</button><button data-m="all">All</button></div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <a class="item" href="#/settings" id="navSettings" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-1);text-decoration:none;font-weight:500">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings</a>
      <div class="stamp" id="stamp"></div>
    </div>
  </aside>
  <main>
    <div class="top" id="top">
      <button id="menuBtn" class="ghost" aria-label="Menu">&#9776;</button>
      <h1 id="title">&nbsp;</h1><span class="sub" id="subtitle"></span>
      <span class="spacer"></span>
      <span id="actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></span>
    </div>
    <div class="view" id="view">
      <div class="frames" id="frames"></div>
      <div id="page"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<script src="/app.js"></script>
</body>
</html>
